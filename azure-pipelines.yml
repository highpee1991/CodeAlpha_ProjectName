trigger:
  - main

resources:
  - repo: self

variables:
  dockerRegistryServiceConnection: "35bff728-40ea-42a4-bf8f-ead90173c7bd"
  azureServiceConnection: "sc-codealpha-azure"
  imageRepository: "devops-status-dashboard"
  containerRegistry: "acrcodealpha92njum.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "$(Build.BuildId)"
  vmImageName: "ubuntu-latest"

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build Docker image
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push image to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Deploy container
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: Update App Service container
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                echo "Configuring App Service with the full ACR image path..."

                az webapp config set \
                  --resource-group rg-codealpha-dev \
                  --name app-codealpha-92njum \
                  --linux-fx-version "DOCKER|$(containerRegistry)/$(imageRepository):$(tag)" \
                  --acr-use-identity true \
                  --acr-identity '[system]'

                echo "Restarting App Service..."

                az webapp restart \
                  --resource-group rg-codealpha-dev \
                  --name app-codealpha-92njum

                echo "Waiting for application health check..."

                for attempt in {1..18}; do
                  status=$(curl -sS -o /tmp/health-response -w "%{http_code}" \
                    https://app-codealpha-92njum.azurewebsites.net/health || true)

                  if [ "$status" = "200" ]; then
                    echo "Application is healthy!"
                    cat /tmp/health-response
                    exit 0
                  fi

                  echo "Attempt $attempt: HTTP $status. Waiting..."
                  sleep 10
                done

                echo "Application failed its health check."
                cat /tmp/health-response || true
                exit 1
