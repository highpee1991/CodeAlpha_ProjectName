trigger:
  - main

resources:
  - repo: self

variables:
  dockerRegistryServiceConnection: "35bff728-40ea-42a4-bf8f-ead90173c7bd"
  azureServiceConnection: "sc-codealpha-azure"
  imageRepository: "devops-status-dashboard"
  containerRegistry: "acrcodealpha92njum.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "$(Build.BuildId)"
  vmImageName: "ubuntu-latest"

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build Docker image
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push image to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Deploy container
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: Update App Service container
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                echo "Configuring App Service to use managed identity..."
                az webapp config set \
                  --resource-group rg-codealpha-dev \
                  --name app-codealpha-92njum \
                  --acr-use-identity true \
                  --acr-identity '[system]'

                echo "Updating the container image..."
                az webapp config container set \
                  --resource-group rg-codealpha-dev \
                  --name app-codealpha-92njum \
                  --container-image-name "$(imageRepository):$(tag)" \
                  --container-registry-url "https://$(containerRegistry)" \
                  --enable-app-service-storage false

                echo "Restarting App Service..."
                az webapp restart \
                  --resource-group rg-codealpha-dev \
                  --name app-codealpha-92njum

                echo "Deployment commands completed."
                echo "Image: $(containerRegistry)/$(imageRepository):$(tag)"
